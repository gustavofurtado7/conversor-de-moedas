<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <title>Money Converter</title>
</head>

<body>
    <img src="./assets/logo.gif" alt="Logo" class="logo-site">
    <main>
        <label class="converter">
            Converter <b>de</b>
            <select class="moeda">
                <option>R$ Real Brasileiro</option>
            </select>
        </label>

        <label class="converter">
            Converter <b>para</b>
            <select class="moeda">
                <option>U$ Dólar Americano</option>
                <option>£ Euro </option>
            </select>
        </label>
        <label id="valor-convertido">
            Valor
            <input placeholder="R$10.000,00">
        </label>

        <button>Converter</button>

        <section>
            <div class="currency-box">
                <img src="./assets/real.png" alt="Logo-moeda-a-converter">
                <p class="currency">Real</p>
                <p class="currency-value">R$ 0,00</p>
            </div>

            <img class="arrow-img" src="./assets/arrow.png" alt="Seta">

            <div class="currency-box">
                <img src="./assets/dolar.png" alt="Logo-moeda-a-convertida">
                <p class="currency">Dólar</p>
                <p class="currency-value">U$ 0.00</p>
            </div>
        </section>
    </main>



</body>

</html>
